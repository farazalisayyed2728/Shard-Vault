services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=shardvault
      - POSTGRES_USER=sv_user
      - POSTGRES_PASSWORD=sv_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sv_user -d shardvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgres://sv_user:sv_pass@db:5432/shardvault
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=dev-secret-key-do-not-use-in-prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: