services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=shardvault
      - POSTGRES_USER=sv_user
      - POSTGRES_PASSWORD=sv_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sv_user -d shardvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  node1:
    build: ./storage_node
    volumes:
      - node1_data:/data
    environment:
      - HMAC_SECRET=dev-hmac-secret-do-not-use-in-prod

  node2:
    build: ./storage_node
    volumes:
      - node2_data:/data
    environment:
      - HMAC_SECRET=dev-hmac-secret-do-not-use-in-prod

  node3:
    build: ./storage_node
    volumes:
      - node3_data:/data
    environment:
      - HMAC_SECRET=dev-hmac-secret-do-not-use-in-prod

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgres://sv_user:sv_pass@db:5432/shardvault
      - REDIS_URL=redis://redis:6379/1
      - HMAC_SECRET=dev-hmac-secret-do-not-use-in-prod
      - SECRET_KEY=dev-secret-key-do-not-use-in-prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    command: celery -A config worker -l INFO
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgres://sv_user:sv_pass@db:5432/shardvault
      - REDIS_URL=redis://redis:6379/1
      - HMAC_SECRET=dev-hmac-secret-do-not-use-in-prod
      - SECRET_KEY=dev-secret-key-do-not-use-in-prod
    depends_on:
      - redis
      - db

  celery-beat:
    build: .
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgres://sv_user:sv_pass@db:5432/shardvault
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=dev-secret-key-do-not-use-in-prod
    depends_on:
      - redis
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
  node1_data:
  node2_data:
  node3_data: