{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: auto; text-align: center;">
    <h2>Share Link Created</h2>
    <p>File: {{ file.display_name }}</p>
    <input type="text" value="{{ request.scheme }}://{{ request.get_host }}{% url 'public_share_download' raw_token %}" readonly style="width: 100%; padding: 10px; margin-bottom: 20px;" id="share-url">
    <button id="copy-share-link" class="btn">Copy Link</button>
    <br><br>
    <a href="{% url 'file_list' %}">Back to My Files</a>
</div>
{% endblock %}
